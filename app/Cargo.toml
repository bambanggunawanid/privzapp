[package]
name = "privzapp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
pz-core = { workspace = true }
pz-engine = { workspace = true }
pz-img = { workspace = true }
# PDF editor: bytes → JS (base64) and editor-state JSON from the overlay.
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# Engine worker round-trips (app/src/engine.rs) await a oneshot per job.
futures-channel = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Window",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "console",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
