[workspace]
resolver = "2"
members = [
    "app",
    "crates/pz-core",
    "crates/pz-crypto",
    "crates/pz-img",
    "crates/pz-pdf",
    "crates/pz-archive",
    "crates/pz-engine",
    "tools/seo-gen",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/privzapp/privzapp"

[workspace.dependencies]
pz-core = { path = "crates/pz-core" }
pz-crypto = { path = "crates/pz-crypto" }
pz-img = { path = "crates/pz-img" }
pz-pdf = { path = "crates/pz-pdf" }
pz-archive = { path = "crates/pz-archive" }
pz-engine = { path = "crates/pz-engine" }

dioxus = { version = "0.7.10" }
# No rayon/avif: keeps the WASM build small and free of thread assumptions.
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "qoi",
] }
# No rayon (threads unavailable on wasm32) and no time providers (not needed).
lopdf = { version = "0.44", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
sha2 = "0.10"
# Password → key derivation; hmac-only feature set keeps it pure Rust/wasm-safe.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Fast binaries everywhere; dx additionally runs wasm-opt for the web bundle.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
