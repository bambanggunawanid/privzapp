# Mounted over /etc/nginx/pz-gc.conf by docker-compose: forwards the
# beacon to the GoatCounter sidecar. Same-origin from the browser's
# point of view, so the CSP stays connect-src 'self'.
proxy_pass http://goatcounter:8080/count;
proxy_set_header Host stats.privzapp.com;
# GoatCounter needs the client address to derive the COUNTRY; it is
# configured (collect=32, see deploy/goatcounter/entrypoint.sh) to
# store only that country - the address itself is used in memory for
# the lookup and never written anywhere (access logs are off).
proxy_set_header X-Forwarded-For $remote_addr;
# Belt and braces: the language never needs to transit at all.
proxy_set_header Accept-Language "";
proxy_connect_timeout 2s;
proxy_read_timeout 5s;
# nginx resolves this hostname ONCE at startup. If you recreate the
# analytics container on its own it gets a new IP and beacons 504 until
# nginx re-resolves - restart the web container too (a normal
# `docker compose up -d` does both). Failure is silent and harmless for
# visitors: the beacon is fire-and-forget and nothing depends on it.
