# PrivZapp security headers — included in the server block AND in every
# location that uses add_header, because nginx's add_header does not
# inherit into locations that set their own.
#
# The CSP is the browser-enforced version of the core product promise:
# connect-src 'self' means the page cannot send bytes anywhere else, no
# matter what code ends up running. Notes on the allowances:
# - script-src 'unsafe-inline': dx emits an inline bootstrap script and the
#   prerender carries a tiny inline splash-fallback; both change per build,
#   so hash-pinning them needs build-time header generation (future work).
# - 'wasm-unsafe-eval': required to instantiate the engine wasm.
# - 'unsafe-eval': required by Dioxus's document::eval JS bridge — ALL of
#   the app's JS interop (previews, downloads, the editor channel) runs
#   through it; without this the wasm aborts on first interop call
#   (verified: tests/ui/csp-smoke.mjs fails without it).
# - blob:/data: in img/connect/worker/media: previews, PDF.js page loads
#   and downloads all flow through object URLs — never off-device.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
