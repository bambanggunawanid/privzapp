# PrivZapp static hosting.
#
# Privacy notes:
# - access_log off: we don't record who fetched the app. There is nothing
#   else to log — files are processed in the browser and never reach us.
# - The CSP (deploy/security-headers.conf) browser-enforces the promise:
#   connect-src 'self' means the page cannot phone home anywhere. Verified
#   by the headless Playwright smoke against the built container
#   (scripts/ui-test.sh covers the app itself).
#
# nginx's add_header does NOT inherit into locations that set their own,
# so the shared header include is repeated wherever Cache-Control is set.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;

    include /etc/nginx/pz-security-headers.conf;
    # Default: always revalidate (index.html, sw.js, manifest, icons are
    # unhashed — the service worker update flow depends on revalidation).
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types application/wasm application/javascript text/javascript
               text/css application/json application/manifest+json
               image/svg+xml;
    gzip_min_length 1024;
    # The Dockerfile precompresses the bundle: serve the .gz siblings
    # (the wasm shrinks ~3x) without per-request CPU.
    gzip_static on;

    # ES modules (PDF.js): stock mime.types lacks .mjs, and browsers
    # hard-reject module imports with a non-JS MIME type (nosniff makes
    # that strict). Hashed like the rest of /assets/ → immutable.
    location ~* ^/assets/.*\.mjs$ {
        default_type text/javascript;
        include /etc/nginx/pz-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # dx fingerprints everything under /assets/ — cache forever.
    location /assets/ {
        include /etc/nginx/pz-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # nginx's stock mime.types has no .webmanifest mapping.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/pz-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Prerendered route pages first (tool/<slug>/index.html), then the
    # SPA shell for anything else.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
